[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solarseg"
version = "0.1.0"
description = "Reproducible solar filament instance segmentation for MAGFiLO 2026"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
include = ["solarseg*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
exclude = ["references", "notebooks"]
